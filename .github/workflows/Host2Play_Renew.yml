name: Host2Play 续期

on:
  schedule:
    - cron: '0 0,11,22 * * *'    # 触发点: 00:00, 11:00, 22:00
    - cron: '30 5,16 * * *'      # 触发点: 05:30, 16:30
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  run-first:
    name: 首次执行
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.renew_run.outcome == 'success' && 'true' || 'false' }}

    steps:
      - name: 记录开始时间
        run: echo "START_TS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"
          curl -s --max-time 10 https://api.ipify.org && echo
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: 执行续订
        id: renew_run
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u main.py

      - name: 上传截图（首次）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-first-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 写入本次运行时间并推送
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_LABEL: 首次执行
        run: |
          TZ=Asia/Shanghai
          export TZ
          END_TS=$(date +%s)
          START_TS=${START_TS:-$END_TS}
          DURATION=$((END_TS - START_TS))
          START_LOCAL=$(date -d "@$START_TS" +"%Y-%m-%d %H:%M:%S")
          END_LOCAL=$(date -d "@$END_TS" +"%Y-%m-%d %H:%M:%S")

          cat > run_time_host2play.txt <<EOF
          最近一次运行
          阶段: ${JOB_LABEL}
          开始时间: ${START_LOCAL} (Asia/Shanghai)
          结束时间: ${END_LOCAL} (Asia/Shanghai)
          耗时: ${DURATION} 秒
          结果: ${JOB_STATUS}
          运行编号: ${{ github.run_number }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_time_host2play.txt
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 Host2Play 最近一次运行时间 [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  run-retry:
    name: 重试执行
    runs-on: ubuntu-latest
    needs: run-first
    if: always() && needs.run-first.outputs.success == 'false'
    permissions:
      actions: write
      contents: write

    steps:
      - name: 记录开始时间
        run: echo "START_TS=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: 等待 60 秒（让 IP 封锁冷却）
        run: sleep 60

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -f -y

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 2
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"
          curl -s --max-time 10 https://api.ipify.org && echo
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true

      - name: 执行续订（重试）
        id: renew_retry
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u main.py

      - name: 上传截图（重试）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-retry-${{ github.run_number }}
          path: output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 写入本次运行时间并推送
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_LABEL: 重试执行
        run: |
          TZ=Asia/Shanghai
          export TZ
          END_TS=$(date +%s)
          START_TS=${START_TS:-$END_TS}
          DURATION=$((END_TS - START_TS))
          START_LOCAL=$(date -d "@$START_TS" +"%Y-%m-%d %H:%M:%S")
          END_LOCAL=$(date -d "@$END_TS" +"%Y-%m-%d %H:%M:%S")

          cat > run_time_host2play.txt <<EOF
          最近一次运行
          阶段: ${JOB_LABEL}
          开始时间: ${START_LOCAL} (Asia/Shanghai)
          结束时间: ${END_LOCAL} (Asia/Shanghai)
          耗时: ${DURATION} 秒
          结果: ${JOB_STATUS}
          运行编号: ${{ github.run_number }}
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run_time_host2play.txt
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 更新 Host2Play 最近一次运行时间 [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2